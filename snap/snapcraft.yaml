name: clipaste
title: Clipaste
summary: Clipboard history that shows the app each item came from
description: |
  Clipaste keeps the history of the text you copy. Press Ctrl+Shift+9,
  find the item and press Enter to copy it again.

  **Features**

  - **Source app**: each item shows the app you copied it from, and the time.
  - **Search**: start to type. The list filters by text and by app name.
  - **Pin**: pinned items are never trimmed and stay when you clear the history.
  - **Keyboard first**: arrow keys to select, Enter to copy, Delete to delete, Esc to hide.
  - **Links**: open a copied link in your browser with one click.
  - **Light and dark theme**: Clipaste follows your system theme.
  - **Tray menu**: recent items, Pause Recording, Hide After Copy, Start at Login and History Size.
  - **Private**: the history stays on your computer. Clipaste does not record
    secrets that password managers mark as concealed.

  **Wayland**

  Wayland does not let apps register global shortcuts. Open Settings >
  Keyboard > Custom Shortcuts and add a shortcut with the command
  `clipaste --toggle`.

  The source app shows for X11 apps. Native Wayland apps do not share this
  information.

  **Upgrade from 1.x**

  Clipaste 2 is a full rewrite. It imports your 1.x history on the first start.

  Clipaste is free and open source (MIT). Report bugs and ideas on GitHub.
website: https://ahmetkorkmaz3.github.io/clipaste/
source-code: https://github.com/ahmetkorkmaz3/clipaste
issues: https://github.com/ahmetkorkmaz3/clipaste/issues
license: MIT
icon: snap/gui/clipaste.png
adopt-info: clipaste
base: core24
grade: stable
confinement: strict

platforms:
  amd64:

apps:
  clipaste:
    # The Chromium sandbox needs "allow-sandbox", which needs a manual store
    # review. The snap confinement isolates the app instead.
    command: app/clipaste --no-sandbox
    extensions: [gnome]
    autostart: clipaste.desktop
    plugs:
      - browser-support
      - home
      - network
      - opengl
      - unity7
      - x11
      - wayland
    environment:
      TMPDIR: $XDG_RUNTIME_DIR

parts:
  # The app files come from "npm run dist:linux" (dist/linux-unpacked).
  clipaste:
    plugin: dump
    source: dist/linux-unpacked
    organize:
      "*": app/
    stage-packages:
      - libnspr4
      - libnss3
      - libxss1
      - libsecret-1-0
    prime:
      - -app/chrome-sandbox
    override-pull: |
      craftctl default
      craftctl set version="$(grep -m1 '"version"' "$CRAFT_PROJECT_DIR/package.json" | cut -d '"' -f4)"
