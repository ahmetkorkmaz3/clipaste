name: Release

# A tag such as v2.0.0 builds all packages, creates the GitHub release and
# publishes the snap to the stable channel of the Snap Store.
# Pull requests that change the build only build the packages (no publish).
# A manual run with a tag only updates the Homebrew tap for that release.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/release.yml
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (for example v2.1.0). Updates only the Homebrew tap."
        required: false

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.name }})
    if: inputs.tag == ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-24.04
            files: |
              dist/*.snap
              dist/*.deb
              dist/*.AppImage
          - name: mac
            os: macos-latest
            files: dist/*.dmg
          - name: windows
            os: windows-latest
            files: dist/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Check that the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

      - name: Set up LXD and snapcraft
        if: matrix.name == 'linux'
        uses: canonical/setup-lxd@v1
      - name: Install snapcraft
        if: matrix.name == 'linux'
        run: sudo snap install snapcraft --classic

      - name: Build packages
        run: npm run dist:${{ matrix.name == 'windows' && 'win' || matrix.name }}
        env:
          # The macOS and Windows packages are not signed.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Build the snap
        if: matrix.name == 'linux'
        run: npm run dist:snap

      - name: Smoke test the snap
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update -q && sudo apt-get install -yq xvfb xclip
          sudo snap install --dangerous dist/*.snap
          xvfb-run -a bash -c '
            clipaste --hidden > clipaste.log 2>&1 &
            pid=$!
            sleep 15
            printf "snap smoke test" | xclip -selection clipboard
            sleep 5
            cat clipaste.log
            kill -0 $pid || { echo "::error::Clipaste stopped"; exit 1; }
            grep -q "snap smoke test" ~/snap/clipaste/current/.config/Clipaste/history.json \
              || { echo "::error::The copied text is not in the history"; exit 1; }
            echo "Clipaste runs and records the clipboard."
          '

      - uses: actions/upload-artifact@v7
        with:
          name: clipaste-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  github-release:
    name: GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Get the release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          cat notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Clipaste ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md \
            --verify-tag

  snap-store:
    name: Snap Store
    needs: github-release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: clipaste-linux
          path: dist
      - name: Install snapcraft
        run: sudo snap install snapcraft --classic
      - name: Upload and release to the stable channel
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: |
          if [ -z "$SNAPCRAFT_STORE_CREDENTIALS" ]; then
            echo "::error::The SNAPCRAFT_STORE_CREDENTIALS secret is not set. See CONTRIBUTING.md."
            exit 1
          fi
          snapcraft upload --release=stable dist/*.snap

  homebrew-tap:
    name: Homebrew tap
    needs: github-release
    if: >-
      !cancelled() &&
      ((startsWith(github.ref, 'refs/tags/v') && needs.github-release.result == 'success') ||
      inputs.tag != '')
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        if: inputs.tag == ''
        with:
          name: clipaste-mac
          path: dist
      - name: Download the .dmg file from the existing release
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag $TAG is not a version tag such as v2.1.0"
            exit 1
          fi
          gh release download "$TAG" --dir dist \
            --pattern "clipaste-${TAG#v}-mac-universal.dmg"
      - name: Check the token
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "::error::The HOMEBREW_TAP_TOKEN secret is not set. See CONTRIBUTING.md."
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          repository: ahmetkorkmaz3/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - name: Update the cask and push it to the tap
        run: |
          version="${TAG#v}"
          sha256=$(sha256sum "dist/clipaste-$version-mac-universal.dmg" | cut -d' ' -f1)
          mkdir -p tap/Casks
          sed -e "s/^  version \".*\"/  version \"$version\"/" \
              -e "s/^  sha256 \".*\"/  sha256 \"$sha256\"/" \
              homebrew/clipaste.rb > tap/Casks/clipaste.rb
          cat tap/Casks/clipaste.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/clipaste.rb
          if git diff --cached --quiet; then
            echo "The cask is already up to date."
            exit 0
          fi
          git commit -m "clipaste $version"
          git push
